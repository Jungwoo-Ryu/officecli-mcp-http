[project]
name = "officecli-mcp-http"
version = "0.1.0"
description = "OfficeCLI DOCX/XLSX tools over Streamable HTTP with webapp file attachments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mcp>=1.30,<2", "uvicorn>=0.35,<1", "pydantic-settings>=2.6,<3"]
[project.scripts]
officecli-mcp = "officecli_mcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/officecli_mcp"]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.14,<0.15", "python-docx>=1,<2", "openpyxl>=3.1,<4"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
